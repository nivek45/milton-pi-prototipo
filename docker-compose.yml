
services:
  postgres:
    image: postgres:16-alpine
    container_name: milton_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: milton
      POSTGRES_PASSWORD: miltonpass
      POSTGRES_DB: miltondb
    ports:
      - "5432:5432"
    volumes:
      - milton_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milton -d miltondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: milton_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@milton.local
      PGADMIN_DEFAULT_PASSWORD: pgadminpass
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - admin   # Opcional: sobe com `docker compose --profile admin up -d`

volumes:
  milton_pgdata:
