services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MILTON_DB_USER:-milton}
      POSTGRES_PASSWORD: ${MILTON_DB_PASS:?Defina MILTON_DB_PASS no arquivo .env}
      POSTGRES_DB: ${MILTON_DB_NAME:-miltondb}
    ports:
      - "127.0.0.1:${MILTON_DB_PORT:-5432}:5432"
    volumes:
      - milton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  milton_pgdata:
